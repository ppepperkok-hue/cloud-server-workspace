# Minimal static CI for cloud-server-workspace.
#
# This repository has no test suite. These checks are static only, matching the
# conventions in .gitattributes and AGENTS.md:
#   * every tracked .sh passes `bash -n` and contains no CR byte;
#   * every tracked .py compiles with `py_compile`;
#   * every tracked .ps1 parses under Windows PowerShell 5.1 and is CRLF in the
#     working tree, because .gitattributes pins `*.ps1 text eol=crlf`.
#
# Nothing is installed, no secrets/ file is read or printed, and no deploy,
# healthcheck or maintenance script is executed: they need either a live host
# or a private secrets map. `scripts/utils/redact-workspace.py --check` is the
# second kind and needs secrets/redaction-map.json, so it stays out of CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-python:
    name: bash -n, LF guard, py_compile (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Read-only job: never persist the token in .git/config.
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No cache input on purpose: no requirements or lockfile exists.

      - name: bash -n and LF-only guard on every tracked shell script
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::git ls-files '*.sh' returned no files; refusing a vacuous check"
            exit 1
          fi
          failed=0
          for script in "${scripts[@]}"; do
            # Read through bash itself: grep treats CRLF as text on some hosts
            # (Git-for-Windows' grep hides the CR), which would make this a no-op.
            if [[ "$(<"$script")" == *$'\r'* ]]; then
              echo "::error file=$script::CR byte found; .gitattributes requires *.sh eol=lf"
              failed=1
            fi
            if ! bash -n "$script"; then
              echo "::error file=$script::bash -n failed"
              failed=1
            fi
          done
          printf 'checked %d shell scripts (bash -n + LF guard), %d failure(s)\n' "${#scripts[@]}" "$failed"
          exit "$failed"

      - name: py_compile on every tracked Python script
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.py')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::git ls-files '*.py' returned no files; refusing a vacuous check"
            exit 1
          fi
          python -m py_compile "${scripts[@]}"
          printf 'compiled %d python scripts\n' "${#scripts[@]}"

  powershell-and-line-endings:
    name: PowerShell parser + .ps1 line endings (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Read-only job: never persist the token in .git/config.
          persist-credentials: false

      - name: Parse every tracked .ps1 with the Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files '*.ps1')
          if ($files.Count -eq 0) {
            throw 'git ls-files returned no .ps1 files; refusing a vacuous check'
          }
          $failures = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path -LiteralPath $file).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors)
            if ($null -eq $tokens -or $tokens.Count -eq 0) {
              $failures += "$file (parser produced no tokens)"
            }
            elseif ($errors.Count -gt 0) {
              $failures += "$file ($($errors.Count) parse error(s)): $($errors[0].Message)"
            }
          }
          if ($failures.Count -gt 0) {
            throw ("PowerShell parse failed: " + ($failures -join '; '))
          }
          Write-Host "ok: parsed $($files.Count) .ps1 files with PowerShell $($PSVersionTable.PSVersion)"

      - name: .ps1 files are CRLF in the working tree (per .gitattributes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files '*.ps1')
          if ($files.Count -eq 0) {
            throw 'git ls-files returned no .ps1 files; refusing a vacuous check'
          }
          $failures = @()
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $file).Path)
            $crlf = 0
            $bareLf = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -ne 10) { continue }
              if ($i -gt 0 -and $bytes[$i - 1] -eq 13) { $crlf += 1 } else { $bareLf += 1 }
            }
            if ($crlf -eq 0 -or $bareLf -gt 0) {
              $failures += "$file (CRLF=$crlf, bare LF=$bareLf)"
            }
          }
          if ($failures.Count -gt 0) {
            throw (".gitattributes declares '*.ps1 text eol=crlf' but these files are not CRLF: " + ($failures -join '; '))
          }
          Write-Host "ok: $($files.Count) .ps1 files are CRLF"
